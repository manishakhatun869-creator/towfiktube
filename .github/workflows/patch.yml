name: Build Towfik Youtube debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # This project patches an existing APK; there is no Gradle debug variant.
      # Use Android's standard debug-key identity for a testing-only artifact.
      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -storepass android -keypass android
          echo "APK_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo 'APK_KEYSTORE_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'APK_KEY_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'APK_KEY_ALIAS=androiddebugkey' >> "$GITHUB_ENV"

      - name: Build testing APK
        env:
          APP_NAME: youtube
          SOURCE: morphe
          ARCH: universal
          GITHUB_TOKEN: ${{ github.token }}
          TRAWL_URL: http://localhost:8191
        run: python -m src

      - name: Verify and name debug APK
        run: |
          shopt -s nullglob
          apks=(youtube-universal-morphe-v*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected one patched YouTube APK, found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.towfik.youtube'" "$RUNNER_TEMP/badging.txt"
          grep -F 'launchable-activity:' "$RUNNER_TEMP/badging.txt" | grep -F "label='Towfik Youtube'"
          mv -- "$apk" Towfik-Youtube-debug.apk

      - name: Upload debug APK as workflow artifact only
        uses: actions/upload-artifact@v4
        with:
          name: towfik-youtube-debug-apk
          path: Towfik-Youtube-debug.apk
          if-no-files-found: error
          retention-days: 7

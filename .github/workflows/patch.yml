name: Build Towfik Youtube release APK

on:
  workflow_dispatch:
  # Also build this session branch on push: the connected GitHub integration
  # cannot dispatch Actions (HTTP 403), but it can push this branch.
  push:
    branches:
      - arena/01a0e305-towfiktube

permissions:
  contents: read

concurrency:
  group: towfik-youtube-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # A private signing key is optional; if not configured, the builder uses
      # its existing public example keystore. All four secrets go together.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64$APK_KEYSTORE_PASSWORD$APK_KEY_PASSWORD$APK_KEY_ALIAS" ]]; then
            if [[ -z "$KEYSTORE_BASE64" || -z "$APK_KEYSTORE_PASSWORD" || -z "$APK_KEY_PASSWORD" || -z "$APK_KEY_ALIAS" ]]; then
              echo 'Configure all four APK signing secrets, or none.' >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/towfik.jks"
            echo "APK_KEYSTORE=$RUNNER_TEMP/towfik.jks" >> "$GITHUB_ENV"
            echo "APK_KEYSTORE_PASSWORD=$APK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_KEY_PASSWORD=$APK_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_KEY_ALIAS=$APK_KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo 'Using the repository public example keystore. Configure secrets for a private signing identity.'
          fi

      - name: Build release APK
        env:
          APP_NAME: youtube
          SOURCE: morphe
          ARCH: universal
          GITHUB_TOKEN: ${{ github.token }}
          TRAWL_URL: http://localhost:8191
        run: python -m src

      - name: Verify and name release APK
        run: |
          shopt -s nullglob
          apks=(youtube-universal-morphe-v*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected one patched YouTube APK, found ${#apks[@]}." >&2
            exit 1
          fi
          apk="${apks[0]}"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.towfik.youtube'" "$RUNNER_TEMP/badging.txt"
          grep -F 'launchable-activity:' "$RUNNER_TEMP/badging.txt" | grep -F "label='Towfik Youtube'"
          mv -- "$apk" Towfik-Youtube-release.apk

      - name: Upload release APK to this Actions run
        uses: actions/upload-artifact@v4
        with:
          name: towfik-youtube-release-apk
          path: Towfik-Youtube-release.apk
          if-no-files-found: error
          retention-days: 14
